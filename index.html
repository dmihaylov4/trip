<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #f4f2ee;
    --surface: #ffffff;
    --border:  #dddbd5;
    --ink:     #1a1a14;
    --muted:   #6b6b56;
    --red:     #b33a2e;
    --red-bg:  #fdf0ee;
    --green:   #1a6645;
    --green-bg:#eaf3ee;
    --radius:  8px;
  }
  body { font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--bg); color: var(--ink); min-height: 100vh; }
  .page { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 2rem; }

  .section { margin-bottom: 1.25rem; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }

  input[type=text], input[type=url], input[type=number], textarea, select {
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; width: 100%; outline: none; transition: border-color 0.15s;
  }
  input:focus, textarea:focus { border-color: var(--ink); background: #fff; }
  textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

  button {
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; border-radius: var(--radius); padding: 9px 14px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    transition: all 0.12s; white-space: nowrap;
  }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-primary:hover { background: #333; }

  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .field-row .field { flex: 1; min-width: 140px; margin-bottom: 0; }
  .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  .counter-row { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
  .counter { display: flex; align-items: center; gap: 10px; }
  .counter label { font-size: 13px; color: var(--muted); min-width: 44px; }
  .counter-btn { width: 30px; height: 30px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 300; flex-shrink: 0; }
  .counter-val { font-size: 18px; font-weight: 500; min-width: 28px; text-align: center; }

  .notice { font-size: 13px; padding: 10px 12px; border-radius: var(--radius); margin-top: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; line-height: 1.5; }
  .notice.warn  { background: #fffbe6; border: 1px solid #e8d870; color: #5a4a00; }
  .notice.err   { background: var(--red-bg); border: 1px solid #e8bebb; color: var(--red); }
  .notice.ok    { background: var(--green-bg); border: 1px solid #a8d8b8; color: var(--green); }
  .notice.info  { background: #f0f4ff; border: 1px solid #c0ccee; color: #2a3a7a; }
  .notice-close { background: none; border: none; padding: 0; font-size: 16px; line-height: 1; cursor: pointer; color: inherit; flex-shrink: 0; }
  .notice-close:hover { background: none; }

  .fetch-status { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 18px; }
  .fetch-status.ok  { color: var(--green); }
  .fetch-status.err { color: var(--red); }

  .loader { display: none; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .loader.active { display: flex; }
  .dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); margin-right: 3px; animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity:0.2; } 40% { opacity:1; } }

  .divider { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

  .board-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .board-count { font-size: 12px; color: var(--muted); }
  .text-btn { font-size: 12px; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; }
  .text-btn:hover { color: var(--red); border: none; background: none; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 12px 8px 0; border-bottom: 1px solid var(--border); }
  thead th:last-child { text-align: right; padding-right: 0; }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody td { padding: 12px 12px 12px 0; vertical-align: top; line-height: 1.5; }
  tbody td:last-child { text-align: right; padding-right: 0; }
  .td-name { font-weight: 500; }
  .td-loc  { font-size: 12px; color: var(--muted); }
  .td-hi   { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .td-link { font-size: 12px; margin-top: 3px; }
  .td-link a { color: var(--muted); text-decoration: underline; }
  .td-who  { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .td-price { font-weight: 500; font-size: 15px; }
  .td-psub  { font-size: 11px; color: var(--muted); }
  .empty-board { font-size: 13px; color: var(--muted); padding: 1.5rem 0; }

  @media (max-width: 520px) {
    .field-row { flex-direction: column; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<div class="page">

  <h1>Trip Planner</h1>

  <!-- SETTINGS -->
  <div class="section">
    <div class="section-label">Settings</div>
    <div class="card">
      <div class="counter-row">
        <div class="counter">
          <label>People</label>
          <button class="counter-btn" onclick="changePeople(-1)">-</button>
          <span class="counter-val" id="people-val">8</span>
          <button class="counter-btn" onclick="changePeople(1)">+</button>
        </div>
        <div class="counter">
          <label>Nights</label>
          <button class="counter-btn" onclick="changeNights(-1)">-</button>
          <span class="counter-val" id="nights-val">7</span>
          <button class="counter-btn" onclick="changeNights(1)">+</button>
        </div>
        <div style="flex:1; min-width:140px;">
          <input type="text" id="user-name" placeholder="Your name" maxlength="30" />
        </div>
      </div>
    </div>
  </div>

  <!-- ADD LISTING -->
  <div class="section">
    <div class="section-label">Add a listing</div>
    <div class="card">

      <div class="field">
        <label>Booking URL</label>
        <div style="display:flex; gap:8px;">
          <input type="url" id="listing-url" placeholder="https://www.booking.com/..." oninput="onUrlInput()" />
          <button onclick="tryFetch()" id="fetch-btn">Auto-fill</button>
        </div>
        <div class="fetch-status" id="fetch-status"></div>
      </div>

      <div class="field-row" style="margin-top:4px;">
        <div class="field">
          <label>Property name</label>
          <input type="text" id="f-name" placeholder="e.g. Villa Sunrise" />
        </div>
        <div class="field">
          <label>Location</label>
          <input type="text" id="f-location" placeholder="e.g. Halkidiki, Greece" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Total price (EUR)</label>
          <input type="number" id="f-price" placeholder="e.g. 1800" min="0" />
        </div>
        <div class="field">
          <label>Beach distance</label>
          <input type="text" id="f-beach" placeholder="e.g. 200m walk" />
        </div>
        <div class="field">
          <label>Max guests</label>
          <input type="number" id="f-guests" placeholder="e.g. 10" min="1" />
        </div>
      </div>

      <div class="field">
        <label>Highlights (optional)</label>
        <input type="text" id="f-highlights" placeholder="e.g. pool, A/C, free parking" />
      </div>

      <div class="field">
        <label>Notes (optional)</label>
        <textarea id="f-notes" placeholder="Anything worth mentioning..."></textarea>
      </div>

      <div class="btn-row">
        <button onclick="clearForm()">Clear</button>
        <button class="btn-primary" id="add-btn" onclick="addListing()">Add to board</button>
      </div>

      <div class="loader" id="loader">
        <span class="dots"><span></span><span></span><span></span></span>
        Fetching page info...
      </div>
      <div id="notices"></div>
    </div>
  </div>

  <hr class="divider" />

  <!-- BOARD -->
  <div class="board-header">
    <div>
      <div class="section-label" style="margin:0">All listings</div>
      <div class="board-count" id="board-count"></div>
    </div>
    <button class="text-btn" onclick="loadBoard()">Refresh</button>
  </div>

  <div class="empty-board" id="board-empty" style="display:none;">No listings yet — add the first one above.</div>
  <table id="board-table" style="display:none;">
    <thead>
      <tr>
        <th>Property</th>
        <th>Beach</th>
        <th style="text-align:right">Per person</th>
      </tr>
    </thead>
    <tbody id="board-body"></tbody>
  </table>

</div>
<script>
// ── CONFIG ──
const SUPABASE_URL = 'https://ntobxxiplcamwbfeirno.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50b2J4eGlwbGNhbXdiZmVpcm5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMTA3MTcsImV4cCI6MjA5NTg4NjcxN30.PvKU4CETydg-c2sS53tYvBNrK8rGmohr0c4EJRjeM0c';

// CORS proxies to try in order
const PROXIES = [
  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
];

let people = 8, nights = 7;

// ── CONTROLS ──
function changePeople(d) { people = Math.max(1, people+d); document.getElementById('people-val').textContent = people; }
function changeNights(d) { nights = Math.max(1, nights+d); document.getElementById('nights-val').textContent = nights; }

function onUrlInput() {
  document.getElementById('fetch-status').textContent = '';
  document.getElementById('fetch-status').className = 'fetch-status';
}

function clearForm() {
  ['listing-url','f-name','f-location','f-price','f-beach','f-guests','f-highlights','f-notes']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('fetch-status').textContent = '';
  document.getElementById('fetch-status').className = 'fetch-status';
  clearNotices();
}

// ── NOTICES ──
function notice(msg, type) {
  const el = document.createElement('div');
  el.className = 'notice ' + type;
  el.innerHTML = `<span>${msg}</span><button class="notice-close" onclick="this.parentElement.remove()">x</button>`;
  document.getElementById('notices').appendChild(el);
}
function clearNotices() { document.getElementById('notices').innerHTML = ''; }
function setFetchStatus(msg, cls) {
  const el = document.getElementById('fetch-status');
  el.textContent = msg;
  el.className = 'fetch-status' + (cls ? ' ' + cls : '');
}

// ── AUTO-FETCH ──
async function tryFetch() {
  const url = document.getElementById('listing-url').value.trim();
  if (!url) { notice('Paste a URL first.', 'warn'); return; }

  document.getElementById('loader').classList.add('active');
  document.getElementById('fetch-btn').disabled = true;
  setFetchStatus('Trying to fetch page...', '');
  clearNotices();

  let html = null;

  for (const proxyFn of PROXIES) {
    try {
      const res = await fetch(proxyFn(url), { signal: AbortSignal.timeout(8000) });
      if (!res.ok) continue;
      const data = await res.json();
      // allorigins wraps in .contents, corsproxy returns raw text
      html = data.contents || data;
      if (typeof html === 'string' && html.length > 500) break;
      html = null;
    } catch { continue; }
  }

  document.getElementById('loader').classList.remove('active');
  document.getElementById('fetch-btn').disabled = false;

  if (!html) {
    setFetchStatus('Could not auto-fetch — fill in the details manually below.', 'err');
    return;
  }

  // Parse what we can from raw HTML
  const parsed = parseHTML(html, url);
  if (parsed.name)       document.getElementById('f-name').value       = parsed.name;
  if (parsed.location)   document.getElementById('f-location').value   = parsed.location;
  if (parsed.price)      document.getElementById('f-price').value      = parsed.price;
  if (parsed.beach)      document.getElementById('f-beach').value      = parsed.beach;
  if (parsed.guests)     document.getElementById('f-guests').value     = parsed.guests;
  if (parsed.highlights) document.getElementById('f-highlights').value = parsed.highlights;

  const filled = [parsed.name, parsed.location, parsed.price].filter(Boolean).length;
  if (filled >= 2) {
    setFetchStatus('Some details filled in — check and adjust before adding.', 'ok');
  } else {
    setFetchStatus('Could only extract limited info — please fill in the rest manually.', 'err');
  }
}

function parseHTML(html, url) {
  const result = {};

  // Strip tags helper
  const strip = s => s.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();

  // Name — try og:title, then <title>, then h1
  const ogTitle  = html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i);
  const titleTag = html.match(/<title[^>]*>([^<]+)<\/title>/i);
  const h1Tag    = html.match(/<h1[^>]*>([^<]+)<\/h1>/i);
  result.name = strip((ogTitle?.[1] || titleTag?.[1] || h1Tag?.[1] || ''))
    .replace(/\s*[-|].*$/, '') // strip " | Booking.com" suffixes
    .replace(/Book .+? at /i, '')
    .trim()
    .slice(0, 80);

  // Location — og:description or meta description often has it
  const desc = html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']{10,}?)["']/i)?.[1] || '';
  const locMatch = desc.match(/(?:in|at|located in)\s+([A-Z][^,.]{2,30}(?:,\s*[A-Z][^,.]{2,20})?)/i);
  if (locMatch) result.location = locMatch[1].trim();

  // Try to find location from URL itself
  if (!result.location) {
    if (url.includes('booking.com/hotel/')) {
      const m = url.match(/booking\.com\/hotel\/([a-z]{2})\//);
      if (m) {
        const countries = { gr:'Greece', hr:'Croatia', es:'Spain', it:'Italy', fr:'France', pt:'Portugal', de:'Germany', tr:'Turkey', cy:'Cyprus', mt:'Malta' };
        result.location = countries[m[1]] || m[1].toUpperCase();
      }
    }
  }

  // Price — look for common patterns
  const pricePatterns = [
    /(\d[\d,.]+)\s*(?:EUR|€)/i,
    /(?:EUR|€)\s*(\d[\d,.]+)/i,
    /"price"\s*:\s*"?(\d+(?:\.\d+)?)"?/i,
    /totalPrice[^>]*>\s*(?:EUR|€)?\s*(\d[\d,.]+)/i,
  ];
  for (const p of pricePatterns) {
    const m = html.match(p);
    if (m) {
      const val = parseFloat(m[1].replace(/,/g, ''));
      if (val > 50 && val < 100000) { result.price = Math.round(val); break; }
    }
  }

  // Guests
  const guestM = html.match(/(\d+)\s*(?:guests?|people|persons?|sleeps?)/i);
  if (guestM) result.guests = parseInt(guestM[1]);

  // Beach
  const beachM = html.match(/(\d+)\s*m(?:etres?|eters?)?\s*(?:from\s+)?(?:the\s+)?beach/i)
    || html.match(/(?:beach|sea)\s*(?:front|side|view)/i);
  if (beachM) result.beach = beachM[0].replace(/<[^>]+>/g,'').trim().slice(0,40);

  // Highlights — look for common amenities mentioned
  const amenities = ['pool','parking','wifi','wi-fi','air conditioning','A/C','kitchen','garden','terrace','balcony','sea view','pet'];
  const found = amenities.filter(a => new RegExp(a,'i').test(html)).slice(0,4);
  if (found.length) result.highlights = found.join(', ');

  return result;
}

// ── ADD TO SUPABASE ──
async function addListing() {
  clearNotices();
  const name  = document.getElementById('f-name').value.trim();
  const price = document.getElementById('f-price').value.trim();

  if (!name)  { notice('Property name is required.', 'warn'); return; }

  const addedBy = document.getElementById('user-name').value.trim() || 'Unknown';
  const url     = document.getElementById('listing-url').value.trim();

  const payload = {
    url:            url || null,
    name,
    location:       document.getElementById('f-location').value.trim() || null,
    price_total:    price ? parseFloat(price) : null,
    price_currency: 'EUR',
    beach_distance: document.getElementById('f-beach').value.trim() || null,
    highlights:     document.getElementById('f-highlights').value.trim() || null,
    notes:          document.getElementById('f-notes').value.trim() || null,
    added_by:       addedBy,
    people,
    nights,
  };

  document.getElementById('add-btn').disabled = true;

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/listings`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }

    clearForm();
    await loadBoard();
  } catch(e) {
    console.error(e);
    notice('Could not save: ' + e.message, 'err');
  } finally {
    document.getElementById('add-btn').disabled = false;
  }
}

// ── LOAD BOARD ──
async function loadBoard() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/listings?order=created_at.desc&limit=100`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error(await res.text());
    const rows = await res.json();
    renderBoard(rows);
  } catch(e) {
    console.error('Board load failed:', e);
  }
}

function renderBoard(rows) {
  const empty = document.getElementById('board-empty');
  const table = document.getElementById('board-table');
  const tbody = document.getElementById('board-body');
  const count = document.getElementById('board-count');

  if (!rows || !rows.length) {
    empty.style.display = 'block';
    table.style.display = 'none';
    count.textContent = '';
    return;
  }

  empty.style.display = 'none';
  table.style.display = 'table';
  count.textContent = rows.length + ' listing' + (rows.length !== 1 ? 's' : '');

  tbody.innerHTML = rows.map(l => {
    const pp  = l.price_total && l.people ? Math.round(l.price_total / l.people) : null;
    const ppn = pp && l.nights ? Math.round(pp / l.nights) : null;
    const when = timeAgo(l.created_at);
    const beach = l.beach_distance || '—';

    return `<tr>
      <td>
        <div class="td-name">${esc(l.name)}</div>
        ${l.location   ? `<div class="td-loc">${esc(l.location)}</div>` : ''}
        ${l.highlights ? `<div class="td-hi">${esc(l.highlights)}</div>` : ''}
        ${l.notes      ? `<div class="td-hi" style="font-style:italic;">${esc(l.notes)}</div>` : ''}
        ${l.url        ? `<div class="td-link"><a href="${esc(l.url)}" target="_blank" rel="noopener">View listing</a></div>` : ''}
        <div class="td-who">${esc(l.added_by)} &middot; ${l.people || '?'}p / ${l.nights || '?'}n &middot; ${when}</div>
      </td>
      <td style="white-space:nowrap;">${esc(beach)}</td>
      <td>
        <div class="td-price">${pp ? '&euro;' + pp.toLocaleString() : '&mdash;'}</div>
        ${ppn ? `<div class="td-psub">&euro;${ppn}/night</div>` : ''}
        ${l.price_total ? `<div class="td-psub">&euro;${Math.round(l.price_total).toLocaleString()} total</div>` : ''}
      </td>
    </tr>`;
  }).join('');
}

// ── HELPERS ──
function timeAgo(ts) {
  const m = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (m < 2)  return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──
loadBoard();
// Auto-refresh every 30s so everyone sees new entries
setInterval(loadBoard, 30000);
</script>
</body>
</html>
