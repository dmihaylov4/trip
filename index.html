<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salam
 </title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:    #f1ead8;
    --paper-2:  #ebe2cb;
    --card:     #fbf7ec;
    --rule:     #1a1208;
    --ink:      #1a1208;
    --ink-soft: #4a3a28;
    --muted:    #8a7659;
    --stamp:    #b53a1f;
    --stamp-bg: #f4dfd6;
    --olive:    #5a6b2f;
    --olive-bg: #e8ead2;
    --shadow:   4px 4px 0 var(--rule);
    --shadow-sm:2px 2px 0 var(--rule);
  }

  html { background: var(--paper); }
  body { font-family: 'Inter', sans-serif; font-size: 14.5px; color: var(--ink); background: var(--paper); min-height: 100vh; line-height: 1.5; }
  .page { max-width: 760px; margin: 0 auto; padding: 3.5rem 1.75rem 6rem; }

  /* ── Masthead ── */
  .masthead { border-bottom: 2px solid var(--rule); padding-bottom: 1.25rem; margin-bottom: 2.5rem; }
  .kicker { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 0.9rem; }
  .kicker span:nth-child(2) { color: var(--stamp); }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-style: italic; font-size: clamp(54px, 9vw, 88px); line-height: 0.92; letter-spacing: -0.04em; color: var(--ink); }
  h1 .amp { font-style: italic; color: var(--stamp); font-weight: 400; }
  .masthead-foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 0.6rem; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-soft); letter-spacing: 0.05em; }
  .page-subtitle { font-style: italic; font-family: 'Fraunces', serif; font-size: 14px; color: var(--ink-soft); }
  .trip-meta { text-align: right; line-height: 1.7; }

  /* ── Form collapse ── */
  .section { margin-bottom: 1.25rem; }
  .section-toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 10px 0; user-select: none; border-bottom: 1px solid var(--rule); }
  .section-toggle:hover .section-label { color: var(--stamp); }
  .section-toggle-chevron { color: var(--rule); transition: transform 0.25s ease; flex-shrink: 0; }
  .form-body { overflow: hidden; max-height: 3000px; opacity: 1; transition: max-height 0.35s ease, opacity 0.2s ease; padding-top: 1.25rem; }
  .form-body.collapsed { max-height: 0; opacity: 0; padding-top: 0; }
  .section-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }

  /* ── Form card ── */
  .form-card { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 1.75rem; }
  .form-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 22px; color: var(--ink); margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; }

  /* ── Inputs ── */
  input[type=text], input[type=url], input[type=number], input[type=date] {
    font-family: 'Inter', sans-serif; font-size: 15px; color: var(--ink);
    background: transparent; border: none; border-bottom: 1px solid var(--rule);
    border-radius: 0; padding: 6px 0 8px; width: 100%; outline: none; transition: border-color 0.15s;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); font-style: italic; }
  input[type=text]:focus, input[type=url]:focus, input[type=number]:focus, input[type=date]:focus {
    border-bottom-color: var(--stamp); border-bottom-width: 2px; padding-bottom: 7px;
  }
  textarea { font-family: 'Inter', sans-serif; font-size: 14.5px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; padding: 10px 12px; width: 100%; outline: none; resize: vertical; min-height: 72px; line-height: 1.55; transition: border-color 0.15s; }
  textarea:focus { border-color: var(--stamp); background: #fff; }

  /* ── File upload ── */
  .file-label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; color: var(--ink-soft); cursor: pointer; border: 1.5px dashed var(--rule); border-radius: 2px; padding: 12px 14px; background: var(--paper); transition: all 0.15s; width: 100%; }
  .file-label:hover { background: var(--stamp-bg); color: var(--stamp); border-color: var(--stamp); }
  input[type=file] { display: none; }
  .file-previews { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .file-thumb, .existing-thumb { position: relative; width: 70px; height: 70px; border-radius: 2px; overflow: hidden; border: 1px solid var(--rule); flex-shrink: 0; }
  .file-thumb img, .existing-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .file-thumb-remove, .existing-thumb-remove { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--rule); color: var(--paper); border: none; font-size: 11px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .file-thumb-remove:hover, .existing-thumb-remove:hover { background: var(--stamp); }

  /* ── Buttons ── */
  button { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius: 2px; padding: 10px 16px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); transition: background 0.15s; white-space: nowrap; }
  button:hover { background: var(--paper-2); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--stamp); color: var(--card); border-color: var(--stamp); }
  .btn-primary:hover { background: #9a2f17; }
  .btn-danger { color: var(--stamp); border-color: transparent; background: transparent; padding: 6px 8px; }
  .btn-danger:hover { background: var(--stamp-bg); border-color: var(--stamp); }

  /* ── Form fields ── */
  .field { margin-bottom: 20px; }
  .field label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500; color: var(--ink); margin-bottom: 4px; letter-spacing: 0.12em; text-transform: uppercase; }
  .field label span { text-transform: none; letter-spacing: 0; font-family: 'Fraunces', serif; font-style: italic; color: var(--muted); font-size: 12px; }
  .field-row { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .field-row .field { flex: 1; min-width: 140px; margin-bottom: 0; }
  .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--rule); align-items: center; }
  .upload-progress { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-right: auto; letter-spacing: 0.05em; }

  /* ── Notices ── */
  .notice { font-size: 13.5px; padding: 11px 14px; border: 1px solid var(--rule); border-left-width: 5px; border-radius: 2px; margin-top: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; line-height: 1.5; }
  .notice.warn { background: #f6e8b8; border-left-color: #8a6a00; color: #4a3700; }
  .notice.err  { background: var(--stamp-bg); border-left-color: var(--stamp); color: var(--stamp); }
  .notice.ok   { background: var(--olive-bg); border-left-color: var(--olive); color: var(--olive); }
  .notice.info { background: #dde3f0; border-left-color: #3a4a7a; color: #2a3a7a; }
  .notice-close { background: none; border: none; padding: 0 0 0 4px; font-size: 16px; line-height: 1; cursor: pointer; color: inherit; flex-shrink: 0; letter-spacing: 0; }
  .notice-close:hover { background: none; }

  /* ── Board ── */
  .divider { border: none; border-top: 1px solid var(--rule); margin: 3rem 0 2rem; }
  .board-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  .board-count { font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: var(--muted); margin-top: 4px; }
  .text-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink); background: none; border: none; padding: 0; cursor: pointer; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; }
  .text-btn:hover { color: var(--stamp); }

  /* ── Listing cards ── */
  .listing-card { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; margin-bottom: 22px; overflow: hidden; transition: box-shadow 0.15s; }
  .listing-card:hover { box-shadow: var(--shadow); }
  .card-clickable { cursor: pointer; }

  /* ── Carousel ── */
  .carousel { position: relative; background: var(--paper-2); height: 260px; overflow: hidden; border-bottom: 1.5px solid var(--rule); }
  .carousel-track { display: flex; height: 100%; transition: transform 0.35s ease; }
  .carousel-track img { flex-shrink: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(0.95) contrast(1.02); }
  .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: var(--card); color: var(--ink); border: 1.5px solid var(--rule); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; z-index: 2; opacity: 0; transition: opacity 0.15s; box-shadow: var(--shadow-sm); letter-spacing: 0; }
  .carousel:hover .carousel-btn, .carousel:focus-within .carousel-btn { opacity: 1; }
  .carousel-btn.prev { left: 12px; }
  .carousel-btn.next { right: 12px; }
  .carousel-btn:hover { background: var(--stamp); color: var(--card); }
  .carousel-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 4px 8px; background: rgba(26,18,8,0.55); border-radius: 20px; }
  .carousel-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(251,247,236,0.4); transition: background 0.15s; }
  .carousel-dot.active { background: var(--card); }
  .no-photos { height: 130px; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: var(--muted); background: var(--paper-2); border-bottom: 1.5px solid var(--rule); }

  /* ── Card hero ── */
  .card-hero { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 4px; gap: 14px; }
  .card-price-main { font-family: 'Fraunces', serif; font-weight: 600; font-size: 36px; color: var(--ink); line-height: 1; letter-spacing: -0.03em; }
  .card-price-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-left: 4px; }
  .card-price-subs { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); margin-top: 6px; letter-spacing: 0.04em; }
  .card-hero-votes { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .vote-btn { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 6px 12px; font-size: 10.5px; font-weight: 500; color: var(--ink); cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; }
  .vote-btn:hover { background: var(--paper-2); }
  .vote-btn.voted-up   { background: var(--olive); color: var(--card); border-color: var(--olive); }
  .vote-btn.voted-down { background: var(--stamp); color: var(--card); border-color: var(--stamp); }
  .vote-score { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; min-width: 26px; text-align: center; color: var(--ink); letter-spacing: -0.02em; }
  .vote-score.positive { color: var(--olive); }
  .vote-score.negative { color: var(--stamp); }

  /* ── Card body ── */
  .card-body { padding: 4px 20px 18px; }
  .card-name { font-family: 'Fraunces', serif; font-weight: 500; font-style: italic; font-size: 22px; line-height: 1.15; margin-bottom: 6px; color: var(--ink); }
  .card-dates { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink); margin-bottom: 4px; letter-spacing: 0.04em; }
  .card-loc { font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: var(--ink-soft); margin-bottom: 12px; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 9px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper); color: var(--ink); letter-spacing: 0.06em; text-transform: lowercase; }
  .card-notes { font-family: 'Fraunces', serif; font-size: 15px; color: var(--ink-soft); margin-bottom: 14px; line-height: 1.55; font-style: italic; }
  .card-footer { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--rule); letter-spacing: 0.06em; }
  .card-actions { display: flex; gap: 14px; align-items: center; }
  .card-edit-btn { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--ink); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; letter-spacing: 0.08em; text-transform: uppercase; }
  .card-edit-btn:hover { color: var(--stamp); background: none; }
  .card-link { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--stamp); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; letter-spacing: 0.08em; text-transform: uppercase; }

  .empty-board { font-family: 'Fraunces', serif; font-style: italic; font-size: 16px; color: var(--muted); padding: 2.5rem 0; text-align: center; }
  .paste-zone { position: relative; }

  /* ── View switcher ── */
  .view-switcher { display: flex; align-items: center; gap: 14px; margin-bottom: 2rem; }
  .view-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); transition: color 0.2s; }
  .view-label.active { color: var(--ink); font-weight: 500; }
  .view-spin-btn { background: var(--card); border: 1px solid var(--rule); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: transform 0.45s cubic-bezier(.4,0,.2,1), background 0.15s; letter-spacing: 0; text-transform: none; }
  .view-spin-btn:hover { background: var(--paper-2); }
  .view-panel { transition: opacity 0.2s; }

  /* ── Identity bar ── */
  .identity-bar { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 1.75rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .identity-bar strong { color: var(--ink); font-weight: 500; }
  .identity-edit { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .identity-edit:hover { color: var(--stamp); border: none; background: none; }
  .identity-input { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink); background: transparent; border: none; border-bottom: 1px solid var(--rule); border-radius: 0; outline: none; padding: 1px 0; width: 150px; letter-spacing: 0.05em; }
  .identity-input:focus { border-bottom-color: var(--stamp); }

  /* ── Comments ── */
  .card-comments { border-top: 1px solid var(--rule); }
  .comments-toggle-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; cursor: pointer; user-select: none; }
  .comments-toggle-bar:hover { background: var(--paper); }
  .comments-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
  .comments-showhide { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; letter-spacing: 0.08em; text-transform: uppercase; }
  .comments-showhide:hover { color: var(--stamp); border: none; background: none; }
  .comments-body { padding: 0 20px 16px; }
  .comment-item { padding: 10px 0; }
  .comment-item + .comment-item { border-top: 1px dashed var(--rule); }
  .comment-meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; }
  .comment-meta strong { color: var(--ink); font-weight: 500; }
  .comment-actions { display: flex; gap: 10px; flex-shrink: 0; }
  .comment-action-btn { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .comment-action-btn:hover { color: var(--stamp); }
  .comment-text { font-family: 'Fraunces', serif; font-size: 14.5px; color: var(--ink-soft); line-height: 1.5; word-break: break-word; }
  .comment-edit-input { width: 100%; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; padding: 6px 8px; outline: none; resize: none; line-height: 1.45; transition: border-color 0.15s; margin-top: 2px; }
  .comment-edit-input:focus { border-color: var(--stamp); }
  .comment-edit-btns { display: flex; gap: 8px; margin-top: 8px; }
  .comment-form { display: flex; gap: 10px; margin-top: 14px; align-items: flex-end; padding-top: 12px; border-top: 1px solid var(--rule); }
  .comment-input { flex: 1; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; padding: 8px 12px; outline: none; resize: none; line-height: 1.45; transition: border-color 0.15s; }
  .comment-input::placeholder { color: var(--muted); font-style: italic; font-family: 'Fraunces', serif; }
  .comment-input:focus { border-color: var(--stamp); }
  .comment-submit { font-size: 11px; padding: 8px 14px; flex-shrink: 0; }
  .no-comments { font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: var(--muted); padding: 6px 0 12px; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .page { padding: 2rem 1.1rem 4rem; }
    .masthead-foot { flex-direction: column; align-items: flex-start; gap: 8px; }
    .trip-meta { text-align: left; }
    .form-card { padding: 1.25rem; }
    .field-row { flex-direction: column; gap: 0; }
    .field-row .field { min-width: 0; width: 100%; margin-bottom: 18px; }
    .carousel { height: 220px; }
    .card-hero { padding: 14px 16px 0; }
    .card-price-main { font-size: 30px; }
    .card-body { padding: 4px 16px 16px; }
    .card-footer { flex-direction: column; align-items: flex-start; gap: 10px; }
    .card-actions { width: 100%; justify-content: flex-end; }
    .btn-row { flex-wrap: wrap; }
    .btn-row button { flex: 1; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    
    <h1>Salam<span class="amp">,</span> <em>Salam</em></h1>
    <div class="masthead-foot">
      <div class="page-subtitle">Ако нещо не работи — Драго е виновен.</div>
      
    </div>
  </header>

  <div id="identity-bar" class="identity-bar"></div>

  <div class="view-switcher">
    <span class="view-label active" id="vl-stays">Stays</span>
    <button class="view-spin-btn" id="view-spin-btn" onclick="switchView()" title="Switch view">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
    <span class="view-label" id="vl-cars">Cars</span>
  </div>

  <div id="view-stays" class="view-panel">
  <!-- FORM (add + edit) -->
  <div class="section" id="form-section">
    <div class="section-toggle" onclick="toggleForm()">
      <div class="section-label" style="margin:0" id="form-section-label">New listing</div>
      <svg class="section-toggle-chevron" id="form-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </div>
    <div class="form-body" id="form-body">
    <div class="form-card">
      <div class="form-title">
        <span id="form-title-text">New listing</span>
        <button class="btn-danger" id="delete-btn" style="display:none;" onclick="deleteListing()">Discard entry</button>
      </div>

      <div class="field">
        <label>Booking link</label>
        <input type="url" id="listing-url" placeholder="https://www.booking.com/..." oninput="onUrlPaste()" />
      </div>

      <div class="field-row">
        <div class="field">
          <label>Property name</label>
          <input type="text" id="f-name" placeholder="имито" />
        </div>
        <div class="field">
          <label>Location</label>
          <input type="text" id="f-location" placeholder="кадя" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Total price (EUR)</label>
          <input type="number" id="f-price" placeholder="e.g. 1800" min="0" />
        </div>
        <div class="field">

// ── NOTICES ──
function notice(msg, type) {
  const el = document.createElement('div');
  el.className = 'notice ' + type;
  el.innerHTML = `<span>${msg}</span><button class="notice-close" onclick="this.parentElement.remove()">x</button>`;
  document.getElementById('notices').appendChild(el);
}
function clearNotices() { document.getElementById('notices').innerHTML = ''; }

// ── UPLOAD IMAGES ──
async function uploadImages(listingId) {
  const urls = [];
  for (let i = 0; i < pendingFiles.length; i++) {
    const { file } = pendingFiles[i];
    document.getElementById('upload-progress').textContent = `Uploading photo ${i+1}/${pendingFiles.length}...`;
    const ext  = file.name.split('.').pop() || 'jpg';
    const path = `${listingId}/${Date.now()}_${i}.${ext}`;
    const res  = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type, 'x-upsert': 'true' },
      body: file
    });
    const resText = await res.text();
    console.log('Upload status:', res.status, res.statusText);
    console.log('Upload response:', resText);
    if (!res.ok) { console.error('Upload failed:', res.status, resText); notice('Photo upload failed: ' + res.status + ' ' + resText, 'err'); continue; }
    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
    console.log('Uploaded OK, URL:', publicUrl);
    urls.push(publicUrl);
  }
  document.getElementById('upload-progress').textContent = '';
  return urls;
}

// ── SAVE (add or edit) ──
async function saveListing() {
  clearNotices();
  const name = document.getElementById('f-name').value.trim();
  if (!name) { notice('Property name is required.', 'warn'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;

  const currentEditingId = editingId; // capture before any async clears it

  try {
    const price   = document.getElementById('f-price').value.trim();
    const payload = {
      url:            document.getElementById('listing-url').value.trim() || null,
      name,
      location:       document.getElementById('f-location').value.trim() || null,
      price_total:    price ? parseFloat(price.replace(/,/g, '')) : null,
      price_currency: 'EUR',
      beach_distance: document.getElementById('f-beach').value.trim() || null,
      checkin:        document.getElementById('f-checkin').value || null,
      checkout:       document.getElementById('f-checkout').value || null,
      highlights:     document.getElementById('f-highlights').value.trim() || null,
      notes:          document.getElementById('f-notes').value.trim() || null,
      added_by:       getMyName() || 'Anonymous',
      people,
      nights,
    };

    // Upload new images first, merge with kept existing ones
    let listingId;

    if (currentEditingId) {
      listingId = currentEditingId;
    } else {
      // POST new listing to get ID
      payload.image_urls = [];
      const res = await fetch(`${SUPABASE_URL}/rest/v1/listings`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=representation' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(await res.text());
      const [row] = await res.json();
      listingId = row.id;
    }

    // Upload any new photos, then combine with kept existing URLs
    const newUrls = pendingFiles.length > 0 ? await uploadImages(listingId) : [];
    const allUrls = [...existingUrls, ...newUrls];

    // Single PATCH that saves everything — payload fields + image_urls together
    const finalPayload = currentEditingId ? { ...payload, image_urls: allUrls } : { image_urls: allUrls };
    const saveRes = await fetch(`${SUPABASE_URL}/rest/v1/listings?id=eq.${listingId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=representation' },
      body: JSON.stringify(finalPayload)
    });
    if (!saveRes.ok) throw new Error(await saveRes.text());

    clearForm();
    setAddMode();
    await loadBoard();
  } catch(e) {
    console.error(e);
    notice('Could not save: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function toggleComments(id) {

}
async function postComment(listingId) {
  const name = getMyName();
  if (!name) {
    editName();
    document.getElementById('identity-bar').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  const input = document.getElementById(`cinput-${listingId}`);
  const body  = input ? input.value.trim() : '';
  if (!body) return;
  const btn = input.closest('.comment-form').querySelector('.comment-submit');
  btn.disabled = true; input.disabled = true;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ listing_id: listingId, author: name, body })
    });
    if (!res.ok) throw new Error(await res.text());
    input.value = '';
    await refreshComments(listingId);
  } catch(e) { console.error('Comment failed', e); }
  finally { btn.disabled = false; input.disabled = false; }
}
async function deleteComment(commentId, listingId) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/comments?id=eq.${commentId}`, {
    method: 'DELETE',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  if (res.ok) await refreshComments(listingId);
}
function editComment(commentId, listingId) {
  const textEl = document.getElementById(`ctext-${commentId}`);
  if (!textEl) return;
  const cbody = document.getElementById(`cbody-${listingId}`);
  const form = cbody ? cbody.querySelector('.comment-form') : null;
  if (form) form.style.display = 'none';
  const body = textEl.dataset.body || '';
  textEl.innerHTML = `<textarea class="comment-edit-input" id="cedit-${commentId}">${esc(body)}</textarea>
    <div class="comment-edit-btns">
      <button class="comment-action-btn" onclick="saveCommentEdit('${commentId}','${listingId}')">Save</button>
      <button class="comment-action-btn" onclick="cancelCommentEdit('${commentId}','${listingId}')">Cancel</button>
    </div>`;
  const ta = document.getElementById(`cedit-${commentId}`);
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
async function saveCommentEdit(commentId, listingId) {
  const ta = document.getElementById(`cedit-${commentId}`);
  const newBody = ta ? ta.value.trim() : '';
  if (!newBody) return;
  if (ta) ta.disabled = true;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/comments?id=eq.${commentId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=minimal' },
    body: JSON.stringify({ body: newBody })
  });
  if (res.ok) await refreshComments(listingId);
  else if (ta) ta.disabled = false;
}
async function cancelCommentEdit(commentId, listingId) {
  await refreshComments(listingId);
}

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/comments?listing_id=eq.${listingId}&order=created_at.asc`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) return;
    const cmts = await res.json();
    if (window._commentMap) window._commentMap[listingId] = cmts;
    const body = document.getElementById(`cbody-${listingId}`);
    if (body) {
      body.innerHTML = commentsBodyHtml(listingId, cmts);
      if (!expandedComments.has(listingId)) body.style.display = 'none';
    }
    const label = document.querySelector(`#chead-${listingId} .comments-label`);
    if (label) label.textContent = cmts.length ? `Discussion (${cmts.length})` : 'Discussion';
  } catch(e) { console.error('Refresh comments failed', e); }
}

// ── LOAD BOARD ──
async function loadBoard() {
  try {
    const [listRes, cmtRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/listings?order=votes.desc.nullsfirst,created_at.desc&limit=100`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
      fetch(`${SUPABASE_URL}/rest/v1/comments?order=created_at.asc&limit=2000`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } })
    ]);
    if (!listRes.ok) throw new Error(await listRes.text());
    const rows = await listRes.json();
    const allCmts = cmtRes.ok ? await cmtRes.json() : [];
    const commentMap = {};
    allCmts.forEach(c => (commentMap[c.listing_id] = commentMap[c.listing_id] || []).push(c));
    window._commentMap = commentMap;
    renderBoard(rows, commentMap);
  } catch(e) { console.error('Board load failed:', e); }
}

function renderBoard(rows, commentMap) {

  }
  empty.style.display = 'none';
  count.textContent = rows.length + (rows.length !== 1 ? ' entries' : ' entry');

  cards.innerHTML = rows.map((l, li) => {
    const pp   = l.price_total && l.people ? Math.round(l.price_total / l.people) : null;
    const ppn  = pp && l.nights ? Math.round(pp / l.nights) : null;
    const imgs = Array.isArray(l.image_urls) ? l.image_urls : [];
    const tags = [l.beach_distance, ...(l.highlights ? l.highlights.split(',').map(s=>s.trim()) : [])].filter(Boolean);
    const cmts = commentMap[l.id] || [];

    const carouselHtml = imgs.length
      ? `<div class="carousel" id="car-${li}">

          ${imgs.length > 1 ? `

      : `<div class="no-photos">No photos</div>`;

    const myVote = (getVotes())[l.id] || 0;
    const scoreClass = (l.votes||0) > 0 ? 'positive' : (l.votes||0) < 0 ? 'negative' : '';
    const cmtLabel = cmts.length ? `Discussion (${cmts.length})` : 'Discussion';
    const isExpanded = expandedComments.has(l.id);
    return `
    <div class="listing-card${l.url ? ' card-clickable' : ''}" data-id="${esc(l.id)}" onclick="openListing(event,'${esc(l.url||'')}')">
      <div>
        ${carouselHtml}
      </div>
      <div class="card-hero" onclick="event.stopPropagation()">
        <div>
          ${pp ? `<div style="display:flex;align-items:baseline;gap:5px;"><span class="card-price-main">&euro;${pp.toLocaleString()}</span><span class="card-price-label">/person</span></div>` : '<div class="card-price-main">—</div>'}
          <div class="card-price-subs">${ppn ? `&euro;${ppn}/night &middot; ` : ''}${l.price_total ? `&euro;${Math.round(l.price_total).toLocaleString()} total` : ''}</div>
        </div>
        <div class="card-hero-votes">
          <button class="vote-btn ${myVote===1?'voted-up':''}" onclick="vote(event,'${l.id}',1)">Like</button>
          <span class="vote-score ${scoreClass}">${l.votes||0}</span>
          <button class="vote-btn ${myVote===-1?'voted-down':''}" onclick="vote(event,'${l.id}',-1)">Dislike</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-name">${esc(l.name)}</div>
        ${(l.checkin || l.checkout) ? `<div class="card-dates">${formatDates(l.checkin, l.checkout).replace(' &middot; ','')}</div>` : ''}
        ${l.location ? `<div class="card-loc">${esc(l.location)}</div>` : ''}
        ${tags.length ? `<div class="card-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        ${l.notes ? `<div class="card-notes">${esc(l.notes)}</div>` : ''}
        <div class="card-footer">
          <span>${l.added_by && l.added_by !== 'Anonymous' ? 'Added by ' + esc(l.added_by) : timeAgo(l.created_at)}</span>

            <button class="card-edit-btn" onclick="startEdit(event,'${esc(l.id)}')">Edit</button>

// ── CAROUSEL ──
const carIdx = {};
function slide(e, li, dir) {
  e.stopPropagation();
  const track = document.getElementById(`track-${li}`);
  if (!track) return;
  const total = track.children.length;
  carIdx[li] = (carIdx[li] + dir + total) % total;
  track.style.transform = `translateX(-${carIdx[li] * 100}%)`;
  document.querySelectorAll(`[id^="dot-${li}-"]`).forEach((d,i) => d.classList.toggle('active', i === carIdx[li]));
}

function openListing(e, url) {
  if (!url) return;

}

// ── VOTES ──
function getVotes() { try { return JSON.parse(localStorage.getItem(VOTES_KEY)) || {}; } catch { return {}; } }
function saveVotes(v) { localStorage.setItem(VOTES_KEY, JSON.stringify(v)); }

async function vote(e, id, dir) {
  e.stopPropagation();
  const votes = getVotes();
  const current = votes[id] || 0;

  // toggle off if same direction
  const newDir = current === dir ? 0 : dir;
  const delta  = newDir - current; // e.g. 0 - 1 = -1, or 1 - 0 = +1

  if (delta === 0) return;

  votes[id] = newDir === 0 ? undefined : newDir;
  if (!votes[id]) delete votes[id];
  saveVotes(votes);

  // optimistic UI update
  const row = (window._boardRows || []).find(r => r.id === id);
  if (row) { row.votes = (row.votes || 0) + delta; renderBoard(window._boardRows, window._commentMap); }

  // persist to supabase using rpc increment
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_votes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ listing_id: id, delta })
    });
  } catch(e) { console.error('Vote failed', e); }
}

// ── HELPERS ──
function formatDates(cin, cout) {
  if (!cin && !cout) return '';
  const fmt = d => { const [y,m,dy] = d.split('-'); return `${dy}/${m}/${y}`; };
  if (cin && cout) return fmt(cin) + ' - ' + fmt(cout) + ' &middot; ';
  if (cin) return 'From ' + fmt(cin) + ' &middot; ';
  return 'Until ' + fmt(cout) + ' &middot; ';
}
function timeAgo(ts) {
  const m = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function uploadCarImages(carId) {
  const urls = [];
  for (let i = 0; i < carPendingFiles.length; i++) {
    const { file } = carPendingFiles[i];
    document.getElementById('car-upload-progress').textContent = `Uploading photo ${i+1}/${carPendingFiles.length}...`;
    const ext = file.name.split('.').pop() || 'jpg';
    const path = `cars/${carId}/${Date.now()}_${i}.${ext}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
      method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type, 'x-upsert': 'true' }, body: file
    });
    if (res.ok) urls.push(`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`);
    else carNotice('Photo upload failed: ' + res.status, 'err');

  document.getElementById('car-upload-progress').textContent = '';

}

async function saveCarListing() {
  document.getElementById('car-notices').innerHTML = '';
  const name = document.getElementById('cf-name').value.trim();
  if (!name) { carNotice('Car name is required.', 'warn'); return; }
  const btn = document.getElementById('car-save-btn');
  btn.disabled = true;
  const currentId = carEditingId;
  try {
    const price = document.getElementById('cf-price').value.trim();
    const payload = {
      url:          document.getElementById('cf-url').value.trim() || null,
      name,
      company:      document.getElementById('cf-company').value.trim() || null,
      price_total:  price ? parseFloat(price.replace(/,/g,'')) : null,
      price_currency: 'EUR',
      pickup_date:  document.getElementById('cf-pickup-date').value || null,
      pickup_time:  document.getElementById('cf-pickup-time').value.trim() || null,
      dropoff_date: document.getElementById('cf-dropoff-date').value || null,
      dropoff_time: document.getElementById('cf-dropoff-time').value.trim() || null,
      highlights:   document.getElementById('cf-highlights').value.trim() || null,
      notes:        document.getElementById('cf-notes').value.trim() || null,
      added_by:     getMyName() || 'Anonymous',
    };
    let carId = currentId;
    if (!currentId) {
      payload.image_urls = [];
      const res = await fetch(`${SUPABASE_URL}/rest/v1/car_rentals`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=representation' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(await res.text());
      const [row] = await res.json(); carId = row.id;
    }
    const newUrls = carPendingFiles.length > 0 ? await uploadCarImages(carId) : [];
    const allUrls = [...carExistingUrls, ...newUrls];
    const finalPayload = currentId ? { ...payload, image_urls: allUrls } : { image_urls: allUrls };
    const saveRes = await fetch(`${SUPABASE_URL}/rest/v1/car_rentals?id=eq.${carId}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=representation' },
      body: JSON.stringify(finalPayload)
    });
    if (!saveRes.ok) throw new Error(await saveRes.text());
    clearCarForm(); setCarAddMode(); await loadCars();
  } catch(e) { carNotice('Could not save: ' + e.message, 'err'); }
  finally { btn.disabled = false; }
}
async function deleteCarListing() {
  if (!carEditingId) return;
  if (!confirm('Delete this car rental?')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/car_rentals?id=eq.${carEditingId}`, {
      method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }

    if (!res.ok) throw new Error(await res.text());
    clearCarForm(); setCarAddMode(); await loadCars();
  } catch(e) { carNotice('Could not delete: ' + e.message, 'err'); }
}

        <div>
          ${pp ? `<div style="display:flex;align-items:baseline;gap:5px;"><span class="card-price-main">&euro;${pp.toLocaleString()}</span><span class="card-price-label">/person</span></div>` : '<div class="card-price-main">—</div>'}
          <div class="card-price-subs">${c.price_total ? `&euro;${Math.round(c.price_total).toLocaleString()} total` : ''}</div>
        </div>
        <div class="card-hero-votes">
          <button class="vote-btn ${myVote===1?'voted-up':''}" onclick="voteCar(event,'${c.id}',1)">Like</button>
          <span class="vote-score ${scoreClass}">${c.votes||0}</span>
          <button class="vote-btn ${myVote===-1?'voted-down':''}" onclick="voteCar(event,'${c.id}',-1)">Dislike</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-name">${esc(c.name)}</div>
        ${c.company ? `<div class="card-loc">${esc(c.company)}</div>` : ''}
        ${(pickupStr||dropoffStr) ? `<div class="card-dates">${pickupStr}${pickupStr&&dropoffStr?' &rarr; ':''}${dropoffStr}</div>` : ''}
        ${tags.length ? `<div class="card-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        ${c.notes ? `<div class="card-notes">${esc(c.notes)}</div>` : ''}
        <div class="card-footer">
          <span>${c.added_by && c.added_by!=='Anonymous' ? 'Added by '+esc(c.added_by) : timeAgo(c.created_at)}</span>
          <div class="card-actions">
            <button class="card-edit-btn" onclick="startCarEdit(event,'${esc(c.id)}')">Edit</button>
            ${c.url ? `<span class="card-link" onclick="openListing(event,'${esc(c.url)}')">Open link &rarr;</span>` : ''}
          </div>
        </div>
      </div>
      <div class="card-comments" onclick="event.stopPropagation()">
        <div class="comments-toggle-bar" id="cchead-${c.id}" onclick="toggleCarComments('${c.id}')">
          <span class="comments-label">${cmtLabel}</span>
          <button class="comments-showhide" id="cctoggle-${c.id}">${isExpanded?'hide':'show'}</button>
        </div>
        <div class="comments-body" id="ccbody-${c.id}" style="${isExpanded?'':'display:none'}">
          ${carCommentsBodyHtml(c.id, cmts)}
        </div>
      </div>
    </div>`;
  }).join('');
  rows.forEach((_,ci) => carCarIdx[ci] = 0);
  window._carRows = rows;
}
function startCarEdit(e, id) {
  e.stopPropagation();
  const row = (window._carRows||[]).find(r=>r.id===id);
  if (row) setCarEditMode(row);
}

// ── CARS — CAROUSEL ──
const carCarIdx = {};
function slideC(e, ci, dir) {
  e.stopPropagation();
  const track = document.getElementById(`ctrack-${ci}`);
  if (!track) return;
  const total = track.children.length;
  carCarIdx[ci] = (carCarIdx[ci] + dir + total) % total;
  track.style.transform = `translateX(-${carCarIdx[ci]*100}%)`;
  document.querySelectorAll(`[id^="cdot-${ci}-"]`).forEach((d,i)=>d.classList.toggle('active',i===carCarIdx[ci]));
}

// ── CARS — VOTES ──
async function voteCar(e, id, dir) {
  e.stopPropagation();
  const votes = getCarVotes();
  const current = votes[id] || 0;
  const newDir = current === dir ? 0 : dir;
  const delta  = newDir - current;
  if (delta === 0) return;
  votes[id] = newDir === 0 ? undefined : newDir;
  if (!votes[id]) delete votes[id];
  saveCarVotes(votes);
  const row = (window._carRows||[]).find(r=>r.id===id);
  if (row) { row.votes = (row.votes||0) + delta; renderCars(window._carRows, window._carCmtMap); }
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_car_votes`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ p_car_id: id, delta })
    });
  } catch(e) { console.error('Car vote failed', e); }
}

// ── CARS — COMMENTS ──
function carCommentHtml(c, carId) {
  const isOwn = getMyName() && getMyName() === c.author;
  return `<div class="comment-item" id="carcitem-${c.id}">
    <div class="comment-meta">
      <span><strong>${esc(c.author)}</strong> &middot; ${timeAgo(c.created_at)}</span>
      ${isOwn ? `<span class="comment-actions">
        <button class="comment-action-btn" onclick="editCarComment('${c.id}','${esc(carId)}')">edit</button>
        <button class="comment-action-btn" onclick="deleteCarComment('${c.id}','${esc(carId)}')">delete</button>
      </span>` : ''}
    </div>
    <div class="comment-text" id="carct-${c.id}" data-body="${esc(c.body)}">${esc(c.body)}</div>
  </div>`;
}
function carCommentsBodyHtml(id, cmts) {
  const list = cmts.length ? cmts.map(c=>carCommentHtml(c,id)).join('') : '<div class="no-comments">No comments yet.</div>';
  return list + `<div class="comment-form">
    <textarea class="comment-input" id="ccinput-${id}" placeholder="Add a comment… (⌘↵ to post)"
      onkeydown="carCommentKeydown(event,'${id}')"></textarea>
    <button class="comment-submit" onclick="postCarComment('${id}')">Post</button>
  </div>`;
}
function carCommentKeydown(e, id) { if ((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();postCarComment(id);} }
function toggleCarComments(id) {
  const body = document.getElementById(`ccbody-${id}`);
  const btn  = document.getElementById(`cctoggle-${id}`);
  if (!body) return;
  if (carExpanded.has(id)) { carExpanded.delete(id); body.style.display='none'; if(btn) btn.textContent='show'; }
  else { carExpanded.add(id); body.style.display=''; if(btn) btn.textContent='hide'; }
}
async function postCarComment(carId) {
  const name = getMyName();
  if (!name) { editName(); document.getElementById('identity-bar').scrollIntoView({behavior:'smooth',block:'nearest'}); return; }
  const input = document.getElementById(`ccinput-${carId}`);
  const body  = input ? input.value.trim() : '';
  if (!body) return;
  const btn = input.closest('.comment-form').querySelector('.comment-submit');
  btn.disabled = true; input.disabled = true;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/car_comments`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ car_id: carId, author: name, body })
    });
    if (!res.ok) throw new Error(await res.text());
    input.value = ''; await refreshCarComments(carId);
  } catch(e) { console.error('Car comment failed', e); }
  finally { btn.disabled=false; input.disabled=false; }
}
async function refreshCarComments(carId) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/car_comments?car_id=eq.${carId}&order=created_at.asc`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
  if (!res.ok) return;
  const cmts = await res.json();
  if (window._carCmtMap) window._carCmtMap[carId] = cmts;
  const bodyEl = document.getElementById(`ccbody-${carId}`);
  if (bodyEl) { bodyEl.innerHTML = carCommentsBodyHtml(carId, cmts); if (!carExpanded.has(carId)) bodyEl.style.display='none'; }
  const label = document.querySelector(`#cchead-${carId} .comments-label`);
  if (label) label.textContent = cmts.length ? `Discussion (${cmts.length})` : 'Discussion';
}
async function deleteCarComment(commentId, carId) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/car_comments?id=eq.${commentId}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
  if (res.ok) await refreshCarComments(carId);
}
function editCarComment(commentId, carId) {
  const textEl = document.getElementById(`carct-${commentId}`);
  if (!textEl) return;
  const ccbody = document.getElementById(`ccbody-${carId}`);
  const form = ccbody ? ccbody.querySelector('.comment-form') : null;
  if (form) form.style.display = 'none';
  const body = textEl.dataset.body || '';
  textEl.innerHTML = `<textarea class="comment-edit-input" id="carcedit-${commentId}">${esc(body)}</textarea>
    <div class="comment-edit-btns">
      <button class="comment-action-btn" onclick="saveCarCommentEdit('${commentId}','${carId}')">Save</button>
      <button class="comment-action-btn" onclick="refreshCarComments('${carId}')">Cancel</button>
    </div>`;
  const ta = document.getElementById(`barcedit-${commentId}`);
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }
}
async function saveCarCommentEdit(commentId, carId) {
  const ta = document.getElementById(`barcedit-${commentId}`) || document.getElementById(`carcedit-${commentId}`);
  const newBody = ta ? ta.value.trim() : '';
  if (!newBody) return;
  if (ta) ta.disabled = true;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/car_comments?id=eq.${commentId}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=minimal' },
    body: JSON.stringify({ body: newBody })
  });
  if (res.ok) await refreshCarComments(carId);
  else if (ta) ta.disabled = false;
}

// ── HELPERS (cars) ──
function fmtDate(d) { if (!d) return ''; const [y,m,dy]=d.split('-'); return `${dy}/${m}/${y}`; }

// ── INIT ──
setAddMode();
setCarAddMode();
renderIdentityBar();
loadBoard();
setInterval(loadBoard, 30000);
</script>
