<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Greece 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #f4f2ee;
    --surface: #ffffff;
    --border:  #dddbd5;
    --ink:     #1a1a14;
    --muted:   #6b6b56;
    --red:     #b33a2e;
    --red-bg:  #fdf0ee;
    --green:   #1a6645;
    --green-bg:#eaf3ee;
    --radius:  8px;
  }
  body { font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--bg); color: var(--ink); min-height: 100vh; }
  .page { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 2rem; }

  .section { margin-bottom: 1.25rem; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }

  input[type=text], input[type=url], input[type=number], textarea {
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; width: 100%; outline: none; transition: border-color 0.15s;
  }
  input:focus, textarea:focus { border-color: var(--ink); background: #fff; }
  textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

  /* file input */
  .file-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); cursor: pointer;
    border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 8px 14px; background: var(--bg); transition: border-color 0.15s;
    width: 100%;
  }
  .file-label:hover { border-color: var(--ink); color: var(--ink); }
  input[type=file] { display: none; }
  .file-previews { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .file-thumb { position: relative; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .file-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .file-thumb-remove { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: none; font-size: 11px; line-height: 1; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .file-thumb-remove:hover { background: var(--red); }

  button {
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; border-radius: var(--radius); padding: 9px 14px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    transition: all 0.12s; white-space: nowrap;
  }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-primary:hover { background: #333; }

  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .field-row .field { flex: 1; min-width: 130px; margin-bottom: 0; }
  .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; align-items: center; }
  .upload-progress { font-size: 12px; color: var(--muted); }


  .notice { font-size: 13px; padding: 10px 12px; border-radius: var(--radius); margin-top: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; line-height: 1.5; }
  .notice.warn { background: #fffbe6; border: 1px solid #e8d870; color: #5a4a00; }
  .notice.err  { background: var(--red-bg); border: 1px solid #e8bebb; color: var(--red); }
  .notice-close { background: none; border: none; padding: 0; font-size: 16px; line-height: 1; cursor: pointer; color: inherit; flex-shrink: 0; }
  .notice-close:hover { background: none; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

  .board-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .board-count { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .text-btn { font-size: 12px; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; }
  .text-btn:hover { color: var(--red); border: none; background: none; }

  /* ── LISTING CARDS ── */
  .listing-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .listing-card:hover { border-color: #bbb; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .listing-card[data-url=""] { cursor: default; }

  /* carousel */
  .carousel { position: relative; background: #e8e4dc; height: 200px; overflow: hidden; }
  .carousel-track { display: flex; height: 100%; transition: transform 0.3s ease; }
  .carousel-track img { flex-shrink: 0; width: 100%; height: 100%; object-fit: cover; }
  .carousel-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.45); color: #fff; border: none;
    width: 32px; height: 32px; border-radius: 50%; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; z-index: 2;
    opacity: 0; transition: opacity 0.15s;
  }
  .carousel:hover .carousel-btn { opacity: 1; }
  .carousel-btn.prev { left: 8px; }
  .carousel-btn.next { right: 8px; }
  .carousel-dots { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
  .carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); transition: background 0.15s; }
  .carousel-dot.active { background: #fff; }
  .no-photos { height: 200px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); background: var(--bg); }

  /* card body */
  .card-body { padding: 14px 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
  .card-name { font-weight: 500; font-size: 15px; line-height: 1.3; }
  .card-price { text-align: right; flex-shrink: 0; }
  .card-price-main { font-weight: 500; font-size: 15px; }
  .card-price-sub { font-size: 11px; color: var(--muted); }
  .card-loc { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
  .card-notes { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 6px; line-height: 1.5; }
  .card-footer { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .card-link { font-size: 11px; color: var(--muted); text-decoration: underline; }

  .empty-board { font-size: 13px; color: var(--muted); padding: 1.5rem 0; }

  .paste-zone { position: relative; }
  .paste-zone.drag-over .file-label { border-color: var(--ink); background: #fff; color: var(--ink); }

  @media (max-width: 520px) {
    .field-row { flex-direction: column; }
    .carousel { height: 160px; }
    .no-photos { height: 160px; }
  }
</style>
</head>
<body>
<div class="page">

  <h1>Greece 2026</h1>

  <!-- ADD LISTING -->
  <div class="section">
    <div class="form-card">

      <div class="field">
        <label>Booking URL <span style="font-weight:400">(tap the card to open it)</span></label>
        <input type="url" id="listing-url" placeholder="https://www.booking.com/..." oninput="onUrlPaste()" />
      </div>

      <div class="field-row">
        <div class="field">
          <label>Property name *</label>
          <input type="text" id="f-name" placeholder="e.g. Villa Sunrise" />
        </div>
        <div class="field">
          <label>Location</label>
          <input type="text" id="f-location" placeholder="e.g. Halkidiki, Greece" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Total price (EUR)</label>
          <input type="number" id="f-price" placeholder="e.g. 1800" min="0" />
        </div>
        <div class="field">
          <label>Beach distance</label>
          <input type="text" id="f-beach" placeholder="e.g. 200m walk" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Check-in</label>
          <input type="date" id="f-checkin" />
        </div>
        <div class="field">
          <label>Check-out</label>
          <input type="date" id="f-checkout" />
        </div>
      </div>

      <div class="field">
        <label>Highlights (comma separated)</label>
        <input type="text" id="f-highlights" placeholder="e.g. pool, A/C, free parking" />
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="f-notes" placeholder="Anything worth mentioning..."></textarea>
      </div>

      <div class="field">
        <label>Screenshots</label>
        <div id="paste-zone" class="paste-zone" tabindex="0">
          <label class="file-label" for="f-images">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Choose photos or paste screenshot (Ctrl+V / Cmd+V)
          </label>
          <input type="file" id="f-images" accept="image/*" multiple onchange="previewImages(event)" />
        </div>
        <div class="file-previews" id="file-previews"></div>
      </div>

      <div class="btn-row">
        <span class="upload-progress" id="upload-progress"></span>
        <button onclick="clearForm()">Clear</button>
        <button class="btn-primary" id="add-btn" onclick="addListing()">Add to board</button>
      </div>

      <div id="notices"></div>
    </div>
  </div>

  <hr class="divider" />

  <!-- BOARD -->
  <div class="board-header">
    <div>
      <div class="section-label" style="margin:0">All listings</div>
      <div class="board-count" id="board-count"></div>
    </div>
    
  </div>

  <div class="empty-board" id="board-empty" style="display:none;">No listings yet — add the first one above.</div>
  <div id="board-cards"></div>

</div>
<script>
const SUPABASE_URL = 'https://ntobxxiplcamwbfeirno.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50b2J4eGlwbGNhbXdiZmVpcm5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMTA3MTcsImV4cCI6MjA5NTg4NjcxN30.PvKU4CETydg-c2sS53tYvBNrK8rGmohr0c4EJRjeM0c';
const BUCKET     = 'listing-images';

const people = 8, nights = 7;
let pendingFiles = []; // { file, objectUrl }

// ── CONTROLS ──

function onUrlPaste() {
  const url = document.getElementById('listing-url').value.trim();
  if (!url) return;
  const countryMap = { gr:'Greece', hr:'Croatia', es:'Spain', it:'Italy', fr:'France',
    pt:'Portugal', de:'Germany', tr:'Turkey', cy:'Cyprus', mt:'Malta', rs:'Serbia',
    me:'Montenegro', ba:'Bosnia', mk:'North Macedonia', bg:'Bulgaria', ro:'Romania' };
  const cm = url.match(/booking\.com\/hotel\/([a-z]{2})\//);
  if (cm && countryMap[cm[1]] && !document.getElementById('f-location').value)
    document.getElementById('f-location').value = countryMap[cm[1]];
  const sm = url.match(/\/hotel\/[a-z]{2}\/([^.?#/]+)/);
  if (sm && !document.getElementById('f-name').value)
    document.getElementById('f-name').value = sm[1].replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).slice(0,60);
}

// ── IMAGE PREVIEWS ──
function previewImages(e) {
  addImageFiles(e.target.files);
  e.target.value = '';
}

function renderPreviews() {
  const container = document.getElementById('file-previews');
  container.innerHTML = pendingFiles.map((p, i) => `
    <div class="file-thumb">
      <img src="${p.objectUrl}" alt="" />
      <button class="file-thumb-remove" onclick="removePreview(${i})">x</button>
    </div>`).join('');
}

function removePreview(i) {
  URL.revokeObjectURL(pendingFiles[i].objectUrl);
  pendingFiles.splice(i, 1);
  renderPreviews();
}

// ── PASTE & DROP IMAGES ──
function addImageFiles(files) {
  const allowed = Array.from(files).filter(f => f.type.startsWith('image/')).slice(0, 8 - pendingFiles.length);
  allowed.forEach(f => pendingFiles.push({ file: f, objectUrl: URL.createObjectURL(f) }));
  renderPreviews();
}

document.addEventListener('paste', function(e) {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const imageItems = Array.from(items).filter(i => i.type.startsWith('image/'));
  if (!imageItems.length) return;
  const files = imageItems.map(i => i.getAsFile()).filter(Boolean);
  addImageFiles(files);
});

function clearForm() {
  ['listing-url','f-name','f-location','f-price','f-beach','f-checkin','f-checkout','f-highlights','f-notes']
    .forEach(id => document.getElementById(id).value = '');
  pendingFiles.forEach(p => URL.revokeObjectURL(p.objectUrl));
  pendingFiles = [];
  renderPreviews();
  document.getElementById('upload-progress').textContent = '';
  clearNotices();
}

// ── NOTICES ──
function notice(msg, type) {
  const el = document.createElement('div');
  el.className = 'notice ' + type;
  el.innerHTML = `<span>${msg}</span><button class="notice-close" onclick="this.parentElement.remove()">x</button>`;
  document.getElementById('notices').appendChild(el);
}
function clearNotices() { document.getElementById('notices').innerHTML = ''; }

// ── UPLOAD IMAGES ──
async function uploadImages(listingId) {
  const urls = [];
  for (let i = 0; i < pendingFiles.length; i++) {
    const { file } = pendingFiles[i];
    document.getElementById('upload-progress').textContent = `Uploading photo ${i+1}/${pendingFiles.length}...`;
    const ext  = file.name.split('.').pop();
    const path = `${listingId}/${Date.now()}_${i}.${ext}`;
    const res  = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': file.type,
        'x-upsert': 'true'
      },
      body: file
    });
    if (!res.ok) { console.warn('Upload failed for', path); continue; }
    urls.push(`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`);
  }
  document.getElementById('upload-progress').textContent = '';
  return urls;
}

// ── ADD LISTING ──
async function addListing() {
  clearNotices();
  const name = document.getElementById('f-name').value.trim();
  if (!name) { notice('Property name is required.', 'warn'); return; }

  const btn = document.getElementById('add-btn');
  btn.disabled = true;

  try {
    // 1. Insert listing first to get ID
    const price   = document.getElementById('f-price').value.trim();
    const payload = {
      url:            document.getElementById('listing-url').value.trim() || null,
      name,
      location:       document.getElementById('f-location').value.trim() || null,
      price_total:    price ? parseFloat(price) : null,
      price_currency: 'EUR',
      beach_distance: document.getElementById('f-beach').value.trim() || null,
      checkin:        document.getElementById('f-checkin').value || null,
      checkout:       document.getElementById('f-checkout').value || null,
      highlights:     document.getElementById('f-highlights').value.trim() || null,
      notes:          document.getElementById('f-notes').value.trim() || null,
      added_by:       'Anonymous',
      people,
      nights,
      image_urls:     [],
    };

    const res = await fetch(`${SUPABASE_URL}/rest/v1/listings`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=representation'
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    const [row] = await res.json();

    // 2. Upload images if any
    if (pendingFiles.length > 0) {
      const imageUrls = await uploadImages(row.id);
      if (imageUrls.length > 0) {
        await fetch(`${SUPABASE_URL}/rest/v1/listings?id=eq.${row.id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ image_urls: imageUrls })
        });
      }
    }

    clearForm();
    await loadBoard();
  } catch(e) {
    console.error(e);
    notice('Could not save: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// ── LOAD BOARD ──
async function loadBoard() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/listings?order=created_at.desc&limit=100`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error(await res.text());
    renderBoard(await res.json());
  } catch(e) { console.error('Board load failed:', e); }
}

function renderBoard(rows) {
  const empty = document.getElementById('board-empty');
  const cards = document.getElementById('board-cards');
  const count = document.getElementById('board-count');

  if (!rows || !rows.length) {
    empty.style.display = 'block'; cards.innerHTML = ''; count.textContent = ''; return;
  }
  empty.style.display = 'none';
  count.textContent = rows.length + ' listing' + (rows.length !== 1 ? 's' : '');

  cards.innerHTML = rows.map((l, li) => {
    const pp   = l.price_total && l.people ? Math.round(l.price_total / l.people) : null;
    const ppn  = pp && l.nights ? Math.round(pp / l.nights) : null;
    const imgs = Array.isArray(l.image_urls) ? l.image_urls : [];
    const tags = [l.beach_distance, ...(l.highlights ? l.highlights.split(',').map(s=>s.trim()) : [])].filter(Boolean);

    const carouselHtml = imgs.length
      ? `<div class="carousel" id="car-${li}">
          <div class="carousel-track" id="track-${li}">
            ${imgs.map(u => `<img src="${esc(u)}" alt="" loading="lazy" />`).join('')}
          </div>
          ${imgs.length > 1 ? `
            <button class="carousel-btn prev" onclick="slide(event,${li},-1)">&#8249;</button>
            <button class="carousel-btn next" onclick="slide(event,${li},1)">&#8250;</button>
            <div class="carousel-dots" id="dots-${li}">
              ${imgs.map((_,i) => `<div class="carousel-dot${i===0?' active':''}" id="dot-${li}-${i}"></div>`).join('')}
            </div>` : ''}
        </div>`
      : `<div class="no-photos">No photos</div>`;

    return `
    <div class="listing-card" onclick="openListing(event,'${esc(l.url||'')}')">
      ${carouselHtml}
      <div class="card-body">
        <div class="card-top">
          <div class="card-name">${esc(l.name)}</div>
          <div class="card-price">
            ${pp ? `<div class="card-price-main">&euro;${pp.toLocaleString()}<span style="font-size:11px;font-weight:400;color:var(--muted)">/person</span></div>` : ''}
            ${ppn ? `<div class="card-price-sub">&euro;${ppn}/night</div>` : ''}
            ${l.price_total ? `<div class="card-price-sub">&euro;${Math.round(l.price_total).toLocaleString()} total</div>` : ''}
          </div>
        </div>
        ${l.location ? `<div class="card-loc">${esc(l.location)}</div>` : ''}
        ${tags.length ? `<div class="card-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        ${l.notes ? `<div class="card-notes">${esc(l.notes)}</div>` : ''}
        <div class="card-footer">
          <span>${formatDates(l.checkin, l.checkout)}${esc(l.added_by)} &middot; ${timeAgo(l.created_at)}</span>
          ${l.url ? `<span class="card-link">View listing &rarr;</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  // init carousel indices
  rows.forEach((_, li) => carIdx[li] = 0);
}

// ── CAROUSEL ──
const carIdx = {};
function slide(e, li, dir) {
  e.stopPropagation(); // don't open URL when clicking arrows
  const track = document.getElementById(`track-${li}`);
  if (!track) return;
  const total = track.children.length;
  carIdx[li] = (carIdx[li] + dir + total) % total;
  track.style.transform = `translateX(-${carIdx[li] * 100}%)`;
  // update dots
  const dots = document.querySelectorAll(`[id^="dot-${li}-"]`);
  dots.forEach((d, i) => d.classList.toggle('active', i === carIdx[li]));
}

// ── OPEN URL ──
function openListing(e, url) {
  // ignore clicks on carousel buttons (handled by stopPropagation)
  if (!url) return;
  window.open(url, '_blank', 'noopener');
}

// ── HELPERS ──
function formatDates(cin, cout) {
  if (!cin && !cout) return '';
  const fmt = d => { const dt = new Date(d); return dt.toLocaleDateString('en-GB', { day:'numeric', month:'short' }); };
  if (cin && cout) return fmt(cin) + ' - ' + fmt(cout) + ' &middot; ';
  if (cin) return 'From ' + fmt(cin) + ' &middot; ';
  return 'Until ' + fmt(cout) + ' &middot; ';
}

function timeAgo(ts) {
  const m = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──
loadBoard();
setInterval(loadBoard, 30000);
</script>
